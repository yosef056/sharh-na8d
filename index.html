<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>التفكير الناقد والحوار</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="on-start">
    <main class="wrap">
      <p class="badge">أولى ثانوي · التفكير الناقد ومهارات الحياة · الدرس الرابع</p>

      <section id="start" class="panel">
        <h1>التفكير الناقد والحوار</h1>
        <p class="made">المبرمج يوسف</p>
        <p class="team-label">فريق الشرح</p>
        <ul class="team">
          <li>إياد</li>
          <li>يوسف العماري</li>
          <li>محمد</li>
          <li>ثنيان</li>
        </ul>
        <button class="btn" id="to-speaker-1" type="button">ابدأ الشرح</button>
      </section>

      <section id="lesson" class="panel hidden"></section>

      <section id="quiz" class="panel hidden">
        <div class="meta">
          <span id="counter"></span>
          <span id="live-score"></span>
        </div>
        <div class="progress" aria-hidden="true"><span id="bar"></span></div>
        <h2 id="question"></h2>
        <div class="choices" id="choices"></div>
        <div class="explain" id="explain"></div>
        <div class="actions">
          <button class="btn btn-ghost" id="quiz-back" type="button">رجوع</button>
          <button class="btn hidden" id="next-btn" type="button">التالي</button>
        </div>
      </section>

      <section id="result" class="panel hidden">
        <p class="badge">انتهيت</p>
        <p class="score" id="final-score"></p>
        <p id="final-msg"></p>
        <button class="btn" id="retry-btn" type="button">إعادة من البداية</button>
        <div class="qr-box">
          <p>شارك الدرس بهذا الرمز</p>
          <img id="qr-img" class="hidden" alt="رمز QR لفتح الموقع" width="180" height="180" />
          <p id="share-url" class="share-url"></p>
        </div>
      </section>
    </main>
    <script src="lesson.js"></script>
    <script src="questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
